<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="flameGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffa726;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffee58;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Modern rounded background -->
  <rect width="192" height="192" fill="url(#bgGradient)" rx="38"/>
  
  <!-- Central flame symbol - modern and minimalist -->
  <g transform="translate(96,96)">
    <!-- Main flame shape -->
    <path d="M0,-45 C-12,-45 -20,-35 -20,-20 C-20,-5 -12,5 0,8 C12,5 20,-5 20,-20 C20,-35 12,-45 0,-45 Z" 
          fill="url(#flameGradient)" 
          filter="url(#glow)"
          opacity="0.95"/>
    
    <!-- Inner flame detail -->
    <path d="M0,-35 C-8,-35 -12,-28 -12,-18 C-12,-8 -8,-2 0,0 C8,-2 12,-8 12,-18 C12,-28 8,-35 0,-35 Z" 
          fill="#fff" 
          opacity="0.3"/>
    
    <!-- Streak counter circles -->
    <circle cx="-25" cy="25" r="4" fill="#fff" opacity="0.8"/>
    <circle cx="-15" cy="28" r="4" fill="#fff" opacity="0.6"/>
    <circle cx="-5" cy="30" r="4" fill="#fff" opacity="0.4"/>
    <circle cx="5" cy="30" r="4" fill="#fff" opacity="0.6"/>
    <circle cx="15" cy="28" r="4" fill="#fff" opacity="0.8"/>
    <circle cx="25" cy="25" r="4" fill="#fff"/>
    
    <!-- Clean typography -->
    <text x="0" y="50" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="16" 
          font-weight="600" 
          fill="#fff" 
          opacity="0.9">STREAK</text>
  </g>
</svg>