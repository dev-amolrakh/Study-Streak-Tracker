<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="successGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#56ab2f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a8e6cf;stop-opacity:1" />
    </linearGradient>
    <filter id="checkGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="96" height="96" fill="url(#successGradient)" rx="19"/>
  
  <g transform="translate(48,48)">
    <!-- Modern checkmark -->
    <path d="M-22,-8 L-8,12 L22,-20" 
          stroke="#fff" 
          stroke-width="6" 
          fill="none" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#checkGlow)"
          opacity="0.95"/>
    
    <!-- Subtle highlight -->
    <path d="M-22,-8 L-8,12 L22,-20" 
          stroke="#fff" 
          stroke-width="2" 
          fill="none" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.6"/>
  </g>
</svg>