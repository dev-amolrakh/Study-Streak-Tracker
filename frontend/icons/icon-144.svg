<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 144 144">
  <defs>
    <linearGradient id="bgGradient144" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="flameGradient144" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffa726;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffee58;stop-opacity:1" />
    </linearGradient>
    <filter id="glow144">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="144" height="144" fill="url(#bgGradient144)" rx="29"/>
  
  <g transform="translate(72,72)">
    <!-- Main flame -->
    <path d="M0,-34 C-9,-34 -15,-26 -15,-15 C-15,-4 -9,4 0,6 C9,4 15,-4 15,-15 C15,-26 9,-34 0,-34 Z" 
          fill="url(#flameGradient144)" 
          filter="url(#glow144)"
          opacity="0.95"/>
    
    <!-- Inner detail -->
    <path d="M0,-26 C-6,-26 -9,-21 -9,-14 C-9,-6 -6,-1 0,0 C6,-1 9,-6 9,-14 C9,-21 6,-26 0,-26 Z" 
          fill="#fff" 
          opacity="0.3"/>
    
    <!-- Streak indicators -->
    <circle cx="-19" cy="19" r="3" fill="#fff" opacity="0.8"/>
    <circle cx="-11" cy="21" r="3" fill="#fff" opacity="0.6"/>
    <circle cx="-4" cy="23" r="3" fill="#fff" opacity="0.4"/>
    <circle cx="4" cy="23" r="3" fill="#fff" opacity="0.6"/>
    <circle cx="12" cy="21" r="3" fill="#fff" opacity="0.8"/>
    <circle cx="20" cy="19" r="3" fill="#fff"/>
    
    <!-- Typography -->
    <text x="0" y="37" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="12" 
          font-weight="600" 
          fill="#fff" 
          opacity="0.9">STREAK</text>
  </g>
</svg>