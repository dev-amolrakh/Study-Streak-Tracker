<svg xmlns="http://www.w3.org/2000/svg" width="540" height="720" viewBox="0 0 540 720">
  <!-- Phone mockup background -->
  <rect width="540" height="720" fill="#f8f9fa" rx="24"/>
  
  <!-- Header -->
  <rect x="20" y="40" width="500" height="80" fill="#007BFF" rx="12"/>
  <text x="270" y="90" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="white">Study Streak Tracker</text>
  
  <!-- Streak display -->
  <rect x="40" y="140" width="460" height="120" fill="white" stroke="#e9ecef" stroke-width="2" rx="12"/>
  <text x="270" y="180" text-anchor="middle" font-family="Arial" font-size="32" font-weight="bold" fill="#007BFF">🔥 Current Streak: 7 days</text>
  <text x="270" y="210" text-anchor="middle" font-family="Arial" font-size="16" fill="#6c757d">Keep going — consistency beats intensity.</text>
  <text x="270" y="240" text-anchor="middle" font-family="Arial" font-size="14" fill="#495057">Total: 15 · Best: 12 · Points: 150 · Level: Rising</text>
  
  <!-- Calendar grid mockup -->
  <rect x="40" y="280" width="460" height="300" fill="white" stroke="#e9ecef" stroke-width="2" rx="12"/>
  <text x="60" y="310" font-family="Arial" font-size="16" font-weight="bold" fill="#495057">November 2025</text>
  
  <!-- Calendar days -->
  <g>
    <!-- Row 1 -->
    <circle cx="80" cy="340" r="15" fill="#28a745"/>
    <text x="80" y="345" text-anchor="middle" font-family="Arial" font-size="12" fill="white">1</text>
    
    <circle cx="120" cy="340" r="15" fill="#28a745"/>
    <text x="120" y="345" text-anchor="middle" font-family="Arial" font-size="12" fill="white">2</text>
    
    <circle cx="160" cy="340" r="15" fill="#28a745"/>
    <text x="160" y="345" text-anchor="middle" font-family="Arial" font-size="12" fill="white">3</text>
    
    <circle cx="200" cy="340" r="15" fill="#28a745"/>
    <text x="200" y="345" text-anchor="middle" font-family="Arial" font-size="12" fill="white">4</text>
    
    <circle cx="240" cy="340" r="15" fill="#28a745"/>
    <text x="240" y="345" text-anchor="middle" font-family="Arial" font-size="12" fill="white">5</text>
    
    <circle cx="280" cy="340" r="15" fill="#28a745"/>
    <text x="280" y="345" text-anchor="middle" font-family="Arial" font-size="12" fill="white">6</text>
    
    <circle cx="320" cy="340" r="15" fill="#007BFF"/>
    <text x="320" y="345" text-anchor="middle" font-family="Arial" font-size="12" fill="white">7</text>
    
    <!-- Row 2 -->
    <circle cx="80" cy="380" r="15" fill="#e9ecef"/>
    <text x="80" y="385" text-anchor="middle" font-family="Arial" font-size="12" fill="#6c757d">8</text>
    
    <circle cx="120" cy="380" r="15" fill="#e9ecef"/>
    <text x="120" y="385" text-anchor="middle" font-family="Arial" font-size="12" fill="#6c757d">9</text>
  </g>
  
  <!-- Goal section -->
  <rect x="40" y="600" width="460" height="80" fill="white" stroke="#e9ecef" stroke-width="2" rx="12"/>
  <text x="60" y="630" font-family="Arial" font-size="16" font-weight="bold" fill="#495057">Current Goal:</text>
  <text x="60" y="655" font-family="Arial" font-size="14" fill="#6c757d">Learn React for 30 days</text>
  <text x="60" y="675" font-family="Arial" font-size="12" fill="#28a745">✓ 7 days completed • 23 remaining</text>
  
  <!-- Bottom navigation hint -->
  <rect x="40" y="680" width="460" height="20" fill="#f8f9fa"/>
</svg>