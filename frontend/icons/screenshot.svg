<svg xmlns="http://www.w3.org/2000/svg" width="540" height="720" viewBox="0 0 540 720">
  <defs>
    <linearGradient id="phoneBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="streakGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffa726;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffee58;stop-opacity:1" />
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Modern phone mockup background -->
  <rect width="540" height="720" fill="url(#phoneBg)" rx="24"/>
  
  <!-- Header with gradient -->
  <rect x="20" y="40" width="500" height="80" fill="url(#headerGradient)" rx="16" filter="url(#cardShadow)"/>
  <text x="270" y="90" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="white" opacity="0.95">Study Streak Tracker</text>
  
  <!-- Streak display card -->
  <rect x="40" y="140" width="460" height="140" fill="white" rx="16" filter="url(#cardShadow)"/>
  
  <!-- Flame icon in streak card -->
  <g transform="translate(120,200)">
    <path d="M0,-20 C-6,-20 -10,-15 -10,-8 C-10,-1 -6,3 0,4 C6,3 10,-1 10,-8 C10,-15 6,-20 0,-20 Z" 
          fill="url(#streakGradient)" opacity="0.9"/>
  </g>
  
  <text x="150" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#1a202c">Current Streak</text>
  <text x="150" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#667eea">7 days</text>
  <text x="270" y="250" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b" opacity="0.8">Keep going — consistency beats intensity.</text>
  
  <!-- Stats row -->
  <text x="270" y="270" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Total: 15 • Best: 12 • Points: 150 • Level: Rising</text>
  
  <!-- Calendar card -->
  <rect x="40" y="300" width="460" height="280" fill="white" rx="16" filter="url(#cardShadow)"/>
  <text x="60" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#1a202c">November 2025</text>
  
  <!-- Modern calendar grid -->
  <g>
    <!-- Completed days with gradient -->
    <circle cx="80" cy="360" r="12" fill="#10b981"/>
    <text x="80" y="365" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="white">1</text>
    
    <circle cx="120" cy="360" r="12" fill="#10b981"/>
    <text x="120" y="365" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="white">2</text>
    
    <circle cx="160" cy="360" r="12" fill="#10b981"/>
    <text x="160" y="365" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="white">3</text>
    
    <circle cx="200" cy="360" r="12" fill="#10b981"/>
    <text x="200" y="365" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="white">4</text>
    
    <circle cx="240" cy="360" r="12" fill="#10b981"/>
    <text x="240" y="365" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="white">5</text>
    
    <circle cx="280" cy="360" r="12" fill="#10b981"/>
    <text x="280" y="365" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="white">6</text>
    
    <!-- Current day -->
    <circle cx="320" cy="360" r="12" fill="url(#headerGradient)" stroke="#fff" stroke-width="2"/>
    <text x="320" y="365" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="white">7</text>
    
    <!-- Future days -->
    <circle cx="360" cy="360" r="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="360" y="365" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">8</text>
    
    <circle cx="400" cy="360" r="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="400" y="365" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">9</text>
  </g>
  
  <!-- Goal card -->
  <rect x="40" y="600" width="460" height="80" fill="white" rx="16" filter="url(#cardShadow)"/>
  <text x="60" y="630" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#1a202c">Current Goal</text>
  <text x="60" y="655" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b">Learn React for 30 days</text>
  <text x="60" y="675" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#10b981" font-weight="500">✓ 7 days completed • 23 remaining</text>
  
  <!-- Install button mockup -->
  <rect x="420" y="680" width="100" height="30" fill="url(#headerGradient)" rx="15" opacity="0.9"/>
  <text x="470" y="698" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="white">📱 Install App</text>
</svg>