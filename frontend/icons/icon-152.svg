<svg xmlns="http://www.w3.org/2000/svg" width="152" height="152" viewBox="0 0 152 152">
  <defs>
    <linearGradient id="bgGradient152" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="flameGradient152" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffa726;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffee58;stop-opacity:1" />
    </linearGradient>
    <filter id="glow152">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="152" height="152" fill="url(#bgGradient152)" rx="30"/>
  
  <g transform="translate(76,76)">
    <!-- Main flame -->
    <path d="M0,-36 C-10,-36 -16,-28 -16,-16 C-16,-4 -10,4 0,6 C10,4 16,-4 16,-16 C16,-28 10,-36 0,-36 Z" 
          fill="url(#flameGradient152)" 
          filter="url(#glow152)"
          opacity="0.95"/>
    
    <!-- Inner detail -->
    <path d="M0,-28 C-6,-28 -10,-22 -10,-15 C-10,-7 -6,-2 0,0 C6,-2 10,-7 10,-15 C10,-22 6,-28 0,-28 Z" 
          fill="#fff" 
          opacity="0.3"/>
    
    <!-- Streak indicators -->
    <circle cx="-20" cy="20" r="3" fill="#fff" opacity="0.8"/>
    <circle cx="-12" cy="22" r="3" fill="#fff" opacity="0.6"/>
    <circle cx="-4" cy="24" r="3" fill="#fff" opacity="0.4"/>
    <circle cx="4" cy="24" r="3" fill="#fff" opacity="0.6"/>
    <circle cx="12" cy="22" r="3" fill="#fff" opacity="0.8"/>
    <circle cx="20" cy="20" r="3" fill="#fff"/>
    
    <!-- Typography -->
    <text x="0" y="39" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="13" 
          font-weight="600" 
          fill="#fff" 
          opacity="0.9">STREAK</text>
  </g>
</svg>