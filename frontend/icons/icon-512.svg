<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="flameGradient512" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffa726;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffee58;stop-opacity:1" />
    </linearGradient>
    <filter id="glow512">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Modern rounded background -->
  <rect width="512" height="512" fill="url(#bgGradient512)" rx="102"/>
  
  <!-- Central flame symbol - scaled for 512px -->
  <g transform="translate(256,256)">
    <!-- Main flame shape -->
    <path d="M0,-120 C-32,-120 -53,-93 -53,-53 C-53,-13 -32,13 0,21 C32,13 53,-13 53,-53 C53,-93 32,-120 0,-120 Z" 
          fill="url(#flameGradient512)" 
          filter="url(#glow512)"
          opacity="0.95"/>
    
    <!-- Inner flame detail -->
    <path d="M0,-93 C-21,-93 -32,-75 -32,-48 C-32,-21 -21,-5 0,0 C21,-5 32,-21 32,-48 C32,-75 21,-93 0,-93 Z" 
          fill="#fff" 
          opacity="0.3"/>
    
    <!-- Streak counter circles - larger scale -->
    <circle cx="-67" cy="67" r="11" fill="#fff" opacity="0.8"/>
    <circle cx="-40" cy="75" r="11" fill="#fff" opacity="0.6"/>
    <circle cx="-13" cy="80" r="11" fill="#fff" opacity="0.4"/>
    <circle cx="13" cy="80" r="11" fill="#fff" opacity="0.6"/>
    <circle cx="40" cy="75" r="11" fill="#fff" opacity="0.8"/>
    <circle cx="67" cy="67" r="11" fill="#fff"/>
    
    <!-- Clean typography -->
    <text x="0" y="133" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="42" 
          font-weight="600" 
          fill="#fff" 
          opacity="0.9">STREAK</text>
  </g>
</svg>